name: Packed Global Install Smoke

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pack-install-smoke:
    name: npm pack and global install smoke
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run baseline checks
        env:
          NO_COLOR: "1"
        run: |
          pnpm run lint
          pnpm run typecheck
          pnpm run build
          pnpm test

      - name: Pack package and install CLI globally
        run: |
          npm pack
          npm install -g ./manciple-*.tgz

      - name: Smoke test installed manciple CLI in a temporary project
        run: |
          tmpdir="$(mktemp -d)"
          cd "$tmpdir"
          manciple init
          manciple new "Test task"
          manciple validate
          manciple status
          manciple handoff test-task
