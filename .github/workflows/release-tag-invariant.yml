name: Release Tag Version Invariant

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  check:
    name: Verify tag matches package.json version
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check release tag against package.json version
        run: pnpm exec tsx scripts/checkReleaseTagVersion.ts "${{ github.ref_name }}"
