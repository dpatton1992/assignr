id: document-review-tui-and-review-packet-workflow
title: Document review TUI, task graph, and ReviewPacket workflow
status: needs_review
type: docs
domain: core
priority: medium
depends_on:
  - add-interactive-review-tui
  - add-task-graph-visualization-to-review-tui
  - build-static-manciple-dev-landing-page
blocks: []
conflicts_with: []
can_run_independently: false
allowed_paths:
  - README.md
  - docs/review-tui.md
  - docs/review-queue.md
  - docs/mcp-server.md
forbidden_paths:
  - src/**
  - tests/**
  - package.json
  - pnpm-lock.yaml
  - docs/index.html
  - docs/landing.css
  - docs/landing.js
  - docs/images/**
  - dist/**
  - .manciple/prompts/generated/**
  - .manciple/tasks/completed/**
