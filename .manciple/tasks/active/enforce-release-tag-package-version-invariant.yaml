id: enforce-release-tag-package-version-invariant
title: Enforce the release tag package version invariant
status: pending
type: hardening
domain: core
priority: critical
depends_on:
  - implement-managed-worktree-execution
allowed_paths:
  - scripts/release.ts
  - scripts/checkReleaseTagVersion.ts
  - tests/release.test.ts
  - .github/workflows/release-tag-invariant.yml
forbidden_paths:
  - src/worktrees/**
  - src/review/**
  - .manciple/tasks/completed/**
  - dist/**
goal: Release automation creates version commits and tags in a sequence that guarantees
  every newly published vX.Y.Z tag resolves to package version X.Y.Z.
acceptance_criteria:
  - The release flow writes the next package version, runs the release checks, commits
    that version change, and creates the annotated vX.Y.Z tag on that version commit
    before any tag is pushed or GitHub release is created.
  - The release flow fails closed before publication or remote mutation when the
    worktree is dirty, the release tag already exists, the version commit cannot be
    created, or the tag name does not exactly match the package.json version at the
    tagged commit.
  - A reusable tag-check command accepts a vX.Y.Z tag, reads package.json from the
    commit resolved by that tag, and exits non-zero with a useful diagnostic for a
    missing, malformed, or mismatched tag.
  - Automated tests create isolated temporary Git repositories and prove that a matching
    tag passes and a tag pointing to a commit with a different package version fails.
  - GitHub Actions runs the same invariant check for version-tag pushes so an invalid
    tag cannot proceed unnoticed.
  - Dry-run and preview modes remain side-effect free and accurately describe the
    revised release order.
implementation_notes:
  - Treat the tag-to-package comparison as an exact SemVer string comparison after
    removing only the required leading v from the tag; do not coerce or loosely compare
    versions.
  - Refactor scripts/release.ts into importable, testable units as needed, while
    retaining a small executable entry point and the existing patch, minor, major, OTP,
    dry-run, and preview interfaces.
  - Keep test repositories and release-note files under OS temporary directories and
    clean them up deterministically.
  - Do not force-move or delete an existing local or remote release tag as part of
    automated tests or normal release execution; report any historical mismatch as an
    explicit remediation risk requiring operator action.
  - Publishing, pushing, and GitHub release creation remain operator-triggered effects
    and must not occur in tests.
  - Preserve the managed-worktree and evidence-based review architecture; this task must
    not modify worktree or review modules.
verification:
  commands:
    - pnpm exec vitest run tests/release.test.ts
    - pnpm typecheck
    - pnpm test
outputs_required:
  - files_changed
  - tests_run
  - risks
notes:
  - The current v0.4.9 tag resolves to a commit whose package.json is 0.4.8, which is
    the concrete regression the new invariant must detect without silently rewriting
    history.
  - Path overlap with implement-managed-worktree-execution is limited to that task's
    broad src/tests globs; this task waits on it and forbids its architectural modules.
